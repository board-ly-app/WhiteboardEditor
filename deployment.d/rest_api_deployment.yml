apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-editor-rest-api
  namespace: whiteboard-editor
  labels:
    app: whiteboard-editor.rest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whiteboard-editor-rest-api
  template:
    metadata:
      labels:
        app: whiteboard-editor-rest-api
    spec:
      containers:
      - name: whiteboard-editor-rest-api
        image: ${WHITEBOARD_EDITOR_CR_URI}/rest_api:${WHITEBOARD_EDITOR_TAG}
        imagePullPolicy: Never
        ports:
          - containerPort: 3000
        env:
          # Values should be stored in generic secret named
          # whiteboard-editor-config, which contains contents of .env file.
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_MONGO_URI
          - name: DOMAIN_NAME
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_DOMAIN
          - name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_SESSION_SECRET
          - name: ACCESS_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_ACCESS_TOKEN_SECRET
          - name: ACCESS_TOKEN_EXPIRATION_SECS
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_ACCESS_TOKEN_EXPIRATION_SECS
          - name: REFRESH_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_REFRESH_TOKEN_SECRET
          - name: REFRESH_TOKEN_EXPIRATION_SECS
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_REFRESH_TOKEN_EXPIRATION_SECS
          - name: RATE_LIMIT
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_RATE_LIMIT
          - name: TEMP_USER_EXPIRATION_SECS
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_TEMP_EXPIRATION_SECS
          - name: TEMP_WHITEBOARD_EXPIRATION_SECS
            valueFrom:
              secretKeyRef:
                name: whiteboard-editor-config
                key: WHITEBOARD_EDITOR_TEMP_EXPIRATION_SECS
          # -- Secrets below from mail.env
          - name: SMTP_HOST
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: SMTP_HOST
          - name: SMTP_USER
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: SMTP_USER
          - name: SMTP_PASS
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: SMTP_PASS
          - name: EMAIL_DOMAIN_NAME
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: EMAIL_VERIFICATION_SECRET
          - name: EMAIL_VERIFICATION_SECRET
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: EMAIL_VERIFICATION_SECRET
          - name: SKIP_EMAIL_VERIFICATION
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: SKIP_EMAIL_VERIFICATION
          - name: EMAIL_VERIFICATION_EXPIRATION_SECS
            valueFrom:
              secretKeyRef:
                name: mail-config
                key: EMAIL_VERIFICATION_EXPIRATION_SECS
